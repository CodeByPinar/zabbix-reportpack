<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">How Report Pack works</title>
  <desc id="d">Report Pack reads triggers, events, maintenance and permissions from Zabbix, calculates availability and problems, and delivers PDF, Excel or CSV on screen or by scheduled e-mail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5B7083"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1278" height="558" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="62" fill="#17212B" font-size="26" font-weight="800">How it works</text>
    <text x="48" y="92" fill="#5B7083" font-size="16">Monitoring data is read through the Zabbix API. No database changes, nothing installed on monitored devices.</text>

    <!-- Column 1: Zabbix -->
    <g transform="translate(48 130)">
      <rect width="300" height="370" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#5B7083"/>
      <rect x="29" y="31" width="22" height="8" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="29" y="44" width="22" height="8" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="46" cy="35" r="1.5" fill="#7DDCC9"/><circle cx="46" cy="48" r="1.5" fill="#7DDCC9"/>
      <text x="72" y="49" fill="#17212B" font-size="20" font-weight="800">Zabbix 7.0</text>
      <g font-size="15" fill="#17212B">
        <rect x="20" y="88" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
        <text x="36" y="112" font-weight="700">Triggers and events</text>
        <text x="36" y="132" fill="#5B7083" font-size="13">problem and recovery times</text>
        <rect x="20" y="156" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
        <text x="36" y="180" font-weight="700">Maintenance periods</text>
        <text x="36" y="200" fill="#5B7083" font-size="13">one-time, daily, weekly, monthly</text>
        <rect x="20" y="224" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
        <text x="36" y="248" font-weight="700">Host groups</text>
        <text x="36" y="268" fill="#5B7083" font-size="13">subgroups included</text>
        <rect x="20" y="292" width="260" height="56" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
        <text x="36" y="316" font-weight="700">User permissions</text>
        <text x="36" y="336" fill="#5B7083" font-size="13">each user sees only their hosts</text>
      </g>
    </g>

    <path d="M356 315H412" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Column 2: Report Pack -->
    <g transform="translate(420 130)">
      <rect width="380" height="370" rx="14" fill="#0B3A5B"/>
      <rect x="20" y="22" width="40" height="40" rx="10" fill="#7DDCC9"/>
      <path d="M30 52V40M38 52V32M46 52V44M54 52V36" stroke="#0B3A5B" stroke-width="4" stroke-linecap="round"/>
      <text x="72" y="49" fill="#FFFFFF" font-size="20" font-weight="800">Report Pack</text>
      <g font-size="15" fill="#FFFFFF">
        <circle cx="38" cy="112" r="13" fill="#7DDCC9"/><text x="38" y="117" fill="#0B3A5B" font-size="14" font-weight="800" text-anchor="middle">1</text>
        <text x="62" y="110" font-weight="700">Problem time per host</text>
        <text x="62" y="130" fill="#B7CBDA" font-size="13">overlapping problems merged, counted once</text>
        <circle cx="38" cy="182" r="13" fill="#7DDCC9"/><text x="38" y="187" fill="#0B3A5B" font-size="14" font-weight="800" text-anchor="middle">2</text>
        <text x="62" y="180" font-weight="700">Maintenance removed</text>
        <text x="62" y="200" fill="#B7CBDA" font-size="13">from downtime and from the period (optional)</text>
        <circle cx="38" cy="252" r="13" fill="#7DDCC9"/><text x="38" y="257" fill="#0B3A5B" font-size="14" font-weight="800" text-anchor="middle">3</text>
        <text x="62" y="250" font-weight="700">Compared with the SLA target</text>
        <text x="62" y="270" fill="#B7CBDA" font-size="13">Met or Missed per host, worst first</text>
        <circle cx="38" cy="322" r="13" fill="#7DDCC9"/><text x="38" y="327" fill="#0B3A5B" font-size="14" font-weight="800" text-anchor="middle">4</text>
        <text x="62" y="320" font-weight="700">Branded document</text>
        <text x="62" y="340" fill="#B7CBDA" font-size="13">your logo, colour, company name, footer</text>
      </g>
    </g>

    <path d="M808 240H864" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M808 400H864" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Column 3: outputs -->
    <g transform="translate(872 130)">
      <rect width="360" height="200" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
      <text x="22" y="40" fill="#17212B" font-size="18" font-weight="800">On demand</text>
      <text x="22" y="64" fill="#5B7083" font-size="14">Reports › Report Pack, any user</text>
      <g font-size="14" font-weight="700">
        <rect x="22" y="86" width="96" height="70" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
        <text x="70" y="118" fill="#E5484D" text-anchor="middle">PDF</text>
        <text x="70" y="138" fill="#5B7083" font-size="11" font-weight="400" text-anchor="middle">branded A4</text>
        <rect x="132" y="86" width="96" height="70" rx="10" fill="#FFFFFF" stroke="#1F9D55" stroke-width="2"/>
        <text x="180" y="118" fill="#1F9D55" text-anchor="middle">Excel</text>
        <text x="180" y="138" fill="#5B7083" font-size="11" font-weight="400" text-anchor="middle">real numbers</text>
        <rect x="242" y="86" width="96" height="70" rx="10" fill="#FFFFFF" stroke="#3B82C4" stroke-width="2"/>
        <text x="290" y="118" fill="#3B82C4" text-anchor="middle">CSV</text>
        <text x="290" y="138" fill="#5B7083" font-size="11" font-weight="400" text-anchor="middle">UTF-8</text>
      </g>
      <text x="22" y="184" fill="#5B7083" font-size="13">or the report table right on the page</text>

      <rect y="210" width="360" height="160" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
      <text x="22" y="250" fill="#17212B" font-size="18" font-weight="800">On a schedule</text>
      <text x="22" y="274" fill="#5B7083" font-size="14">daily, weekly or monthly, by cron</text>
      <rect x="22" y="292" width="40" height="30" rx="5" fill="#FFFFFF" stroke="#5B7083" stroke-width="2"/>
      <path d="M24 295L42 310L60 295" fill="none" stroke="#5B7083" stroke-width="2"/>
      <text x="76" y="306" fill="#17212B" font-size="14" font-weight="700">E-mail with the report attached</text>
      <text x="76" y="326" fill="#5B7083" font-size="13">up to 50 recipients per schedule</text>
      <text x="22" y="352" fill="#5B7083" font-size="13">no Zabbix web service needed</text>
    </g>

    <text x="640" y="534" fill="#8B98A5" font-size="13" text-anchor="middle">Proxied hosts work like any other: their data is stored by the Zabbix server.</text>
  </g>
</svg>
