<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Report Pack for Zabbix</title>
  <desc id="d">SLA and problem reports from Zabbix as branded PDF, Excel and CSV, delivered on a schedule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3A5B"/>
      <stop offset="1" stop-color="#071F33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DDCC9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7DDCC9" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="18" fill="url(#grid)"/>
  <circle cx="1010" cy="40" r="300" fill="url(#glow)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Text -->
    <text x="72" y="104" fill="#7DDCC9" font-size="15" font-weight="700" letter-spacing="3">ZABBIX 7.0 LTS · FRONTEND MODULE</text>
    <text x="70" y="182" fill="#FFFFFF" font-size="68" font-weight="800">Report Pack</text>
    <text x="72" y="232" fill="#C9D7E3" font-size="22">SLA and problem reports from Zabbix,</text>
    <text x="72" y="264" fill="#C9D7E3" font-size="22">ready to send to managers and customers.</text>

    <g font-size="15" font-weight="700">
      <rect x="72" y="300" width="74" height="34" rx="17" fill="#E5484D"/>
      <text x="109" y="322" fill="#FFFFFF" text-anchor="middle">PDF</text>
      <rect x="156" y="300" width="84" height="34" rx="17" fill="#1F9D55"/>
      <text x="198" y="322" fill="#FFFFFF" text-anchor="middle">Excel</text>
      <rect x="250" y="300" width="74" height="34" rx="17" fill="#3B82C4"/>
      <text x="287" y="322" fill="#FFFFFF" text-anchor="middle">CSV</text>
      <rect x="334" y="300" width="176" height="34" rx="17" fill="none" stroke="#7DDCC9" stroke-width="1.5"/>
      <text x="422" y="322" fill="#7DDCC9" text-anchor="middle">Scheduled e-mail</text>
    </g>
    <text x="72" y="380" fill="#8FA6B8" font-size="15">Branded · Maintenance aware · No dependencies · AGPL-3.0</text>

    <!-- Spreadsheet card (behind) -->
    <g transform="translate(1000 92)" filter="url(#shadow)">
      <rect width="210" height="250" rx="10" fill="#FFFFFF"/>
      <rect width="210" height="30" rx="10" fill="#1F9D55"/>
      <rect y="20" width="210" height="10" fill="#1F9D55"/>
      <text x="196" y="20" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="end">availability.xlsx</text>
      <g fill="#EEF2F5">
        <rect x="12" y="44" width="186" height="16" fill="#DCEFE4"/>
      </g>
      <g stroke="#E3E8EC">
        <path d="M12 60H198M12 78H198M12 96H198M12 114H198M12 132H198M12 150H198M12 168H198M12 186H198M12 204H198M12 222H198"/>
        <path d="M86 44V230M136 44V230"/>
      </g>
      <g fill="#9AA8B4">
        <rect x="18" y="66" width="56" height="6" rx="3"/><rect x="18" y="84" width="48" height="6" rx="3"/>
        <rect x="18" y="102" width="60" height="6" rx="3"/><rect x="18" y="120" width="44" height="6" rx="3"/>
        <rect x="18" y="138" width="54" height="6" rx="3"/><rect x="18" y="156" width="50" height="6" rx="3"/>
        <rect x="18" y="174" width="58" height="6" rx="3"/><rect x="18" y="192" width="46" height="6" rx="3"/>
        <rect x="18" y="210" width="52" height="6" rx="3"/>
      </g>
      <g fill="#1F9D55">
        <rect x="94" y="66" width="34" height="6" rx="3"/><rect x="94" y="84" width="34" height="6" rx="3"/>
        <rect x="94" y="102" width="34" height="6" rx="3"/><rect x="94" y="120" width="34" height="6" rx="3"/>
        <rect x="94" y="138" width="34" height="6" rx="3"/><rect x="94" y="156" width="34" height="6" rx="3"/>
        <rect x="94" y="174" width="34" height="6" rx="3"/><rect x="94" y="192" width="34" height="6" rx="3"/>
        <rect x="94" y="210" width="34" height="6" rx="3"/>
      </g>
      <g fill="#C3CDD5">
        <rect x="144" y="66" width="40" height="6" rx="3"/><rect x="144" y="84" width="28" height="6" rx="3"/>
        <rect x="144" y="102" width="36" height="6" rx="3"/><rect x="144" y="120" width="22" height="6" rx="3"/>
        <rect x="144" y="138" width="32" height="6" rx="3"/><rect x="144" y="156" width="26" height="6" rx="3"/>
        <rect x="144" y="174" width="38" height="6" rx="3"/><rect x="144" y="192" width="24" height="6" rx="3"/>
        <rect x="144" y="210" width="30" height="6" rx="3"/>
      </g>
    </g>

    <!-- PDF report card (front) -->
    <g transform="translate(700 56)" filter="url(#shadow)">
      <rect width="360" height="350" rx="10" fill="#FFFFFF"/>
      <path d="M10 0H350A10 10 0 0 1 360 10V8H0V10A10 10 0 0 1 10 0Z" fill="#7DDCC9"/>
      <rect y="0" width="360" height="8" rx="4" fill="#2BB5A0"/>
      <rect x="22" y="26" width="26" height="26" rx="6" fill="#0B3A5B"/>
      <path d="M35 32L42 46H28Z" fill="#7DDCC9"/>
      <text x="56" y="45" fill="#0B3A5B" font-size="13" font-weight="700">Your Company</text>
      <text x="22" y="82" fill="#17212B" font-size="19" font-weight="800">Availability report</text>
      <text x="22" y="101" fill="#2BB5A0" font-size="11" font-weight="700">Prepared for Acme Europe GmbH</text>
      <text x="22" y="116" fill="#8B98A5" font-size="9.5">October 2026 · Host group: Customers/Acme</text>

      <!-- KPI tiles -->
      <g>
        <rect x="22" y="128" width="100" height="44" rx="4" fill="#F2F5F8"/>
        <rect x="22" y="128" width="100" height="3" fill="#2BB5A0"/>
        <text x="30" y="152" fill="#17212B" font-size="14" font-weight="800">99.981%</text>
        <text x="30" y="165" fill="#8B98A5" font-size="8">Average availability</text>
        <rect x="130" y="128" width="100" height="44" rx="4" fill="#F2F5F8"/>
        <rect x="130" y="128" width="100" height="3" fill="#2BB5A0"/>
        <text x="138" y="152" fill="#1F9D55" font-size="14" font-weight="800">34 / 36</text>
        <text x="138" y="165" fill="#8B98A5" font-size="8">Hosts meeting SLA</text>
        <rect x="238" y="128" width="100" height="44" rx="4" fill="#F2F5F8"/>
        <rect x="238" y="128" width="100" height="3" fill="#2BB5A0"/>
        <text x="246" y="152" fill="#17212B" font-size="14" font-weight="800">1h 12m</text>
        <text x="246" y="165" fill="#8B98A5" font-size="8">Total downtime</text>
      </g>

      <!-- Daily chart -->
      <g transform="translate(22 186)">
        <g fill="#A8E3D6">
          <rect x="0" y="6" width="9" height="56"/><rect x="13" y="6" width="9" height="56"/><rect x="26" y="6" width="9" height="56"/>
          <rect x="39" y="6" width="9" height="56"/><rect x="52" y="6" width="9" height="56"/><rect x="65" y="6" width="9" height="56"/>
          <rect x="78" y="6" width="9" height="56"/><rect x="91" y="6" width="9" height="56"/><rect x="104" y="6" width="9" height="56"/>
          <rect x="130" y="6" width="9" height="56"/><rect x="143" y="6" width="9" height="56"/><rect x="156" y="6" width="9" height="56"/>
          <rect x="169" y="6" width="9" height="56"/><rect x="182" y="6" width="9" height="56"/><rect x="195" y="6" width="9" height="56"/>
          <rect x="208" y="6" width="9" height="56"/><rect x="234" y="6" width="9" height="56"/><rect x="247" y="6" width="9" height="56"/>
          <rect x="260" y="6" width="9" height="56"/><rect x="273" y="6" width="9" height="56"/><rect x="286" y="6" width="9" height="56"/>
          <rect x="299" y="6" width="9" height="56"/>
        </g>
        <g fill="#E5484D">
          <rect x="117" y="30" width="9" height="32"/><rect x="221" y="22" width="9" height="40"/>
        </g>
        <path d="M0 14H316" stroke="#0B3A5B" stroke-width="1.2" stroke-dasharray="4 3"/>
      </g>

      <!-- Table -->
      <g transform="translate(22 262)">
        <rect width="316" height="16" fill="#0B3A5B"/>
        <g fill="#FFFFFF" opacity="0.85">
          <rect x="8" y="5" width="40" height="6" rx="3"/><rect x="170" y="5" width="44" height="6" rx="3"/><rect x="240" y="5" width="22" height="6" rx="3"/><rect x="284" y="5" width="24" height="6" rx="3"/>
        </g>
        <g>
          <rect y="16" width="316" height="16" fill="#FFFFFF"/>
          <rect y="32" width="316" height="16" fill="#F5F7F9"/>
          <rect y="48" width="316" height="16" fill="#FFFFFF"/>
        </g>
        <g fill="#B6C1CB">
          <rect x="8" y="21" width="96" height="6" rx="3"/><rect x="8" y="37" width="80" height="6" rx="3"/>
          <rect x="8" y="53" width="104" height="6" rx="3"/>
        </g>
        <g fill="#E5484D"><rect x="174" y="21" width="40" height="6" rx="3"/><rect x="240" y="21" width="34" height="6" rx="3"/></g>
        <g fill="#1F9D55">
          <rect x="174" y="37" width="40" height="6" rx="3"/><rect x="174" y="53" width="40" height="6" rx="3"/>
          <rect x="240" y="37" width="22" height="6" rx="3"/><rect x="240" y="53" width="22" height="6" rx="3"/>
        </g>
        <g fill="#C9D2DA"><rect x="284" y="21" width="24" height="6" rx="3"/><rect x="292" y="37" width="16" height="6" rx="3"/><rect x="292" y="53" width="16" height="6" rx="3"/></g>
      </g>
      <text x="22" y="340" fill="#A3AFBA" font-size="8">Your Company · Confidential</text>
      <text x="338" y="340" fill="#A3AFBA" font-size="8" text-anchor="end">Page 1 of 2</text>
    </g>
  </g>
</svg>
