<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">How scheduled reports are sent</title>
  <desc id="d">Cron starts the sender every 15 minutes. It reads the schedules through the Zabbix API, builds the reports that are due, e-mails them and records what it sent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5B7083"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="62" fill="#17212B" font-size="26" font-weight="800">Scheduled reports</text>
    <text x="48" y="92" fill="#5B7083" font-size="16">reportpack-runner.php, a command-line program in the module folder, started by cron.</text>

    <g font-size="15">
      <!-- Step boxes: width 200, gap 46 -->
      <g transform="translate(48 130)">
        <rect width="196" height="130" rx="14" fill="#0B3A5B"/>
        <circle cx="36" cy="38" r="16" fill="none" stroke="#7DDCC9" stroke-width="3"/>
        <path d="M36 28V38L43 43" fill="none" stroke="#7DDCC9" stroke-width="3" stroke-linecap="round"/>
        <text x="20" y="84" fill="#FFFFFF" font-weight="800" font-size="17">Cron</text>
        <text x="20" y="108" fill="#B7CBDA" font-size="13">every 15 minutes</text>
      </g>
      <path d="M250 195H286" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>

      <g transform="translate(292 130)">
        <rect width="196" height="130" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
        <text x="20" y="44" fill="#2BB5A0" font-weight="800" font-size="13">1 · READ</text>
        <text x="20" y="84" fill="#17212B" font-weight="800" font-size="17">Schedules</text>
        <text x="20" y="108" fill="#5B7083" font-size="13">Zabbix API, API token</text>
      </g>
      <path d="M494 195H530" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>

      <g transform="translate(536 130)">
        <rect width="196" height="130" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
        <text x="20" y="44" fill="#2BB5A0" font-weight="800" font-size="13">2 · CHECK</text>
        <text x="20" y="84" fill="#17212B" font-weight="800" font-size="17">What is due</text>
        <text x="20" y="108" fill="#5B7083" font-size="13">against the state file</text>
      </g>
      <path d="M738 195H774" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>

      <g transform="translate(780 130)">
        <rect width="196" height="130" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
        <text x="20" y="44" fill="#2BB5A0" font-weight="800" font-size="13">3 · BUILD</text>
        <text x="20" y="84" fill="#17212B" font-weight="800" font-size="17">PDF, Excel, CSV</text>
        <text x="20" y="108" fill="#5B7083" font-size="13">same as the report page</text>
      </g>
      <path d="M982 195H1018" stroke="#5B7083" stroke-width="2.5" marker-end="url(#arrow)"/>

      <g transform="translate(1024 130)">
        <rect width="208" height="130" rx="14" fill="#F4F7FA" stroke="#D0D7DE"/>
        <text x="20" y="44" fill="#2BB5A0" font-weight="800" font-size="13">4 · SEND</text>
        <text x="20" y="84" fill="#17212B" font-weight="800" font-size="17">E-mail via SMTP</text>
        <text x="20" y="108" fill="#5B7083" font-size="13">STARTTLS, SSL or none</text>
      </g>
    </g>

    <!-- Guarantees -->
    <g transform="translate(48 292)" font-size="14">
      <rect width="1184" height="70" rx="12" fill="#ECF8F5"/>
      <circle cx="30" cy="35" r="5" fill="#2BB5A0"/>
      <text x="44" y="40" fill="#17212B"><tspan font-weight="700">Missed run:</tspan> sent once at the next run</text>
      <circle cx="340" cy="35" r="5" fill="#2BB5A0"/>
      <text x="354" y="40" fill="#17212B"><tspan font-weight="700">Failure:</tspan> retried, reason in the log</text>
      <circle cx="640" cy="35" r="5" fill="#2BB5A0"/>
      <text x="654" y="40" fill="#17212B"><tspan font-weight="700">Lock:</tspan> never sent twice</text>
      <circle cx="880" cy="35" r="5" fill="#2BB5A0"/>
      <text x="894" y="40" fill="#17212B"><tspan font-weight="700">Exit code</tspan> 0 / 1 / 2 for monitoring</text>
    </g>
  </g>
</svg>
