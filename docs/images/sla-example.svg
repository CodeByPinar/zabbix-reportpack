<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Worked example of the availability calculation</title>
  <desc id="d">One host, one day: two overlapping problems are merged, a problem inside maintenance is left out, and availability is 85.227 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF1F4"/>
      <path d="M0 0V8" stroke="#B9C3CC" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="638" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="62" fill="#17212B" font-size="26" font-weight="800">How availability is calculated</text>
    <text x="48" y="92" fill="#5B7083" font-size="16">Example: one host, one day, maintenance excluded, SLA target 99.9%. Times exaggerated so the bars are easy to see.</text>

    <!-- Hour grid: x = 210 + 40 * hour -->
    <g stroke="#EDF0F3">
      <path d="M210 124V392M290 124V392M370 124V392M450 124V392M530 124V392M610 124V392M690 124V392M770 124V392M850 124V392M930 124V392M1010 124V392M1090 124V392M1170 124V392"/>
    </g>
    <g fill="#8B98A5" font-size="12" text-anchor="middle">
      <text x="210" y="412">00:00</text><text x="290" y="412">02:00</text><text x="370" y="412">04:00</text>
      <text x="450" y="412">06:00</text><text x="530" y="412">08:00</text><text x="610" y="412">10:00</text>
      <text x="690" y="412">12:00</text><text x="770" y="412">14:00</text><text x="850" y="412">16:00</text>
      <text x="930" y="412">18:00</text><text x="1010" y="412">20:00</text><text x="1090" y="412">22:00</text>
      <text x="1170" y="412">24:00</text>
    </g>

    <!-- Row labels -->
    <g font-size="15" fill="#17212B" font-weight="700">
      <text x="48" y="153">Trigger A</text>
      <text x="48" y="203">Trigger B</text>
      <text x="48" y="253">Trigger C</text>
      <text x="48" y="303">Maintenance</text>
      <text x="48" y="365">Downtime</text>
    </g>
    <g font-size="12" fill="#8B98A5">
      <text x="48" y="170">High</text>
      <text x="48" y="220">Average</text>
      <text x="48" y="270">Average</text>
      <text x="48" y="320">planned</text>
      <text x="48" y="382">merged result</text>
    </g>

    <!-- Bars -->
    <rect x="210" y="136" width="960" height="28" rx="6" fill="#F7F9FB"/>
    <rect x="210" y="186" width="960" height="28" rx="6" fill="#F7F9FB"/>
    <rect x="210" y="236" width="960" height="28" rx="6" fill="#F7F9FB"/>
    <rect x="210" y="286" width="960" height="28" rx="6" fill="#F7F9FB"/>
    <rect x="210" y="348" width="960" height="32" rx="6" fill="#F7F9FB"/>

    <rect x="570" y="136" width="60" height="28" rx="5" fill="#E5484D"/>
    <rect x="810" y="136" width="30" height="28" rx="5" fill="#E5484D"/>
    <rect x="610" y="186" width="60" height="28" rx="5" fill="#F59E0B"/>
    <rect x="1070" y="236" width="30" height="28" rx="5" fill="#F59E0B" opacity="0.45"/>
    <rect x="1050" y="286" width="80" height="28" rx="5" fill="url(#hatch)" stroke="#9AA8B4"/>

    <rect x="570" y="348" width="100" height="32" rx="5" fill="#0B3A5B"/>
    <rect x="810" y="348" width="30" height="32" rx="5" fill="#0B3A5B"/>
    <rect x="1050" y="348" width="80" height="32" rx="5" fill="url(#hatch)" stroke="#9AA8B4"/>

    <!-- Bar times -->
    <g font-size="11" fill="#5B7083" text-anchor="middle">
      <text x="600" y="131">09:00–10:30</text>
      <text x="825" y="131">15:00–15:45</text>
      <text x="640" y="231">10:00–11:30</text>
      <text x="1085" y="231">21:30–22:15</text>
      <text x="1090" y="281">21:00–23:00</text>
    </g>

    <!-- Annotations -->
    <path d="M610 336V328H630V336" fill="none" stroke="#2BB5A0" stroke-width="2"/>
    <text x="638" y="334" fill="#1E8C7B" font-size="12" font-weight="700">overlap counted once</text>
    <text x="620" y="369" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">2h 30m</text>
    <text x="850" y="369" fill="#0B3A5B" font-size="12" font-weight="700">45m</text>
    <text x="1040" y="369" fill="#5B7083" font-size="12" text-anchor="end">not counted</text>

    <!-- Results -->
    <g transform="translate(48 440)">
      <rect width="270" height="150" rx="12" fill="#F4F7FA" stroke="#D0D7DE"/>
      <text x="20" y="34" fill="#5B7083" font-size="13" font-weight="700">PERIOD COUNTED</text>
      <text x="20" y="76" fill="#17212B" font-size="32" font-weight="800">22h</text>
      <text x="20" y="104" fill="#5B7083" font-size="13">24h minus 2h of maintenance</text>
      <text x="20" y="124" fill="#5B7083" font-size="13">(when maintenance is excluded)</text>

      <rect x="290" width="270" height="150" rx="12" fill="#F4F7FA" stroke="#D0D7DE"/>
      <text x="310" y="34" fill="#5B7083" font-size="13" font-weight="700">DOWNTIME · OUTAGES</text>
      <text x="310" y="76" fill="#17212B" font-size="32" font-weight="800">3h 15m · 2</text>
      <text x="310" y="104" fill="#5B7083" font-size="13">A and B overlap: one outage</text>
      <text x="310" y="124" fill="#5B7083" font-size="13">longest outage 2h 30m</text>

      <rect x="580" width="270" height="150" rx="12" fill="#F4F7FA" stroke="#D0D7DE"/>
      <text x="600" y="34" fill="#5B7083" font-size="13" font-weight="700">PROBLEMS</text>
      <text x="600" y="76" fill="#17212B" font-size="32" font-weight="800">3</text>
      <text x="600" y="104" fill="#5B7083" font-size="13">A twice, B once; C started</text>
      <text x="600" y="124" fill="#5B7083" font-size="13">in maintenance: left out</text>

      <rect x="870" width="314" height="150" rx="12" fill="#0B3A5B"/>
      <text x="890" y="34" fill="#7DDCC9" font-size="13" font-weight="700">AVAILABILITY</text>
      <text x="890" y="76" fill="#FFFFFF" font-size="32" font-weight="800">85.227%</text>
      <text x="890" y="104" fill="#B7CBDA" font-size="13">(22h − 3h 15m) ÷ 22h, rounded down</text>
      <rect x="890" y="114" width="122" height="24" rx="12" fill="#E5484D"/>
      <text x="951" y="131" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">SLA 99.9%: Missed</text>
    </g>
  </g>
</svg>
